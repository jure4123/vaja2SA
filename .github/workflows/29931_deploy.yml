name: Deploy Docker

on:
  workflow_run:
    workflows: ["Testiranje projekta"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: self-hosted

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v3

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vaja2:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vaja2:latest